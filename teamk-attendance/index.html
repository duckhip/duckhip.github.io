<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d6598">
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">
  <title>Team-K 모바일 출석</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #183042;
      --muted: #667784;
      --line: #d9e2e8;
      --brand: #1685c5;
      --brand-dark: #0d6598;
      --success: #238636;
      --danger: #b42318;
      --canvas: #edf5f9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(10px, env(safe-area-inset-top)) 10px max(16px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at top right, rgba(22, 133, 197, 0.18), transparent 34%),
        linear-gradient(180deg, #f8fcff, var(--canvas));
      color: var(--ink);
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    .shell {
      width: min(100%, 520px);
      margin: 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 4px 0 10px;
    }

    .brand-logo {
      width: 1.45rem;
      height: 1.45rem;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      font-size: 0.95rem;
      letter-spacing: -0.04em;
    }

    .card {
      overflow: hidden;
      border: 1px solid rgba(217, 226, 232, 0.9);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 18px 45px rgba(42, 75, 94, 0.12);
    }

    .game-info {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.65fr) minmax(0, 0.8fr);
      gap: 1px;
      background: var(--line);
      border-bottom: 1px solid var(--line);
    }

    .game-item {
      min-width: 0;
      padding: 9px 10px;
      background: #f7fbfd;
    }

    .game-item.account {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      border-top: 1px solid var(--line);
      padding: 12px 14px;
    }

    .game-item.account .account-info {
      flex: 1 1 auto;
      min-width: 0;
    }

    .account .value { white-space: normal; overflow-wrap: anywhere; }

    .briefing {
      position: relative;
      margin: 14px 14px 2px;
      padding: 20px 18px;
      border-radius: 14px;
      background: radial-gradient(circle at top right, #235a6c, transparent 70%), #152d3a;
      color: #fff;
      border-left: 4px solid var(--season-accent, #a8dcae);
    }

    .briefing-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.7rem;
      color: #c2d4dc;
      letter-spacing: 0.06em;
    }

    .season-tag { color: var(--season-accent, #a8dcae); font-weight: 700; }
    .briefing h2 { margin: 12px 0 9px; font-size: clamp(1.3rem, 5.8vw, 1.75rem); letter-spacing: -0.04em; word-break: keep-all; }
    .briefing p { margin: 0; color: #d7e6ec; font-size: 0.86rem; line-height: 1.6; word-break: keep-all; }
    .completion-badge { display: inline-block; padding: 5px 12px; margin-top: 10px; border: 1px solid #a7c9b0; border-radius: 20px; color: #246039; font-size: 0.85rem; }

    .copy-btn {
      flex: 0 0 auto;
      margin-top: 0;
      margin-left: 10px;
      width: 32px;
      height: 32px;
      min-height: 0;
      padding: 0;
      border-radius: 8px;
      background: rgba(22, 133, 197, 0.1);
      color: var(--brand);
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .copy-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 0.76rem;
    }

    .value {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.88rem;
      font-weight: 700;
    }

    form {
      padding: 12px 14px 14px;
    }

    .field {
      margin-bottom: 10px;
    }

    .field.inline {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .field.inline label {
      margin-bottom: 0;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .required {
      color: var(--danger);
      font-size: 0.82em;
    }

    input[type="text"] {
      width: 100%;
      min-height: 49px;
      padding: 12px 13px;
      border: 1px solid #bfcbd3;
      border-radius: 11px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      outline: none;
    }

    .field.inline input[type="text"] {
      flex: 1 1 auto;
      min-width: 0;
    }

    input[type="text"]:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(22, 133, 197, 0.13);
    }

    .check-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 9px 0;
      color: #405463;
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .check-row input {
      width: 20px;
      height: 20px;
      margin: 0;
      flex: 0 0 auto;
      accent-color: var(--brand);
    }

    .minor-row {
      align-items: center;
    }

    .minor-row select {
      min-height: 38px;
      margin-left: auto;
      padding: 7px 30px 7px 10px;
      border: 1px solid #bfcbd3;
      border-radius: 9px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 16px;
    }

    button {
      width: 100%;
      min-height: 48px;
      margin-top: 5px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      color: #fff;
      font: inherit;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 9px 20px rgba(13, 101, 152, 0.2);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.58;
    }

    .message {
      display: none;
      margin: 16px 18px 0;
      padding: 13px;
      border-radius: 11px;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .message.visible {
      display: block;
    }

    .message.error {
      background: #fff0ee;
      color: var(--danger);
    }

    .message.success {
      background: #eaf7ed;
      color: var(--success);
    }

    .message.info {
      background: #eef7fc;
      color: var(--brand-dark);
    }

    [hidden] {
      display: none !important;
    }

    .completion-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(14, 30, 44, 0.65);
    }

    .completion-modal[hidden] {
      display: none;
    }

    .completion-panel {
      width: min(100%, 400px);
      max-height: calc(100vh - 32px);
      max-height: calc(100dvh - 32px);
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 22px 20px 18px;
      border-radius: 22px;
      background: #fff;
      text-align: center;
      box-shadow: 0 28px 70px rgba(14, 30, 44, 0.30);
      animation: panel-pop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes panel-pop {
      from { opacity: 0; transform: scale(0.88) translateY(12px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .completion-logo-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      margin-bottom: 10px;
    }

    .completion-logo-wrap::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(var(--brand), #63d4ff, var(--brand));
      opacity: 0.55;
    }

    .completion-logo-wrap::after {
      content: '';
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      background: #fff;
    }

    .completion-logo {
      position: relative;
      z-index: 1;
      width: 36px;
      height: 36px;
      object-fit: contain;
    }

    .completion-panel h2 {
      margin: 0 0 6px;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.03em;
      overflow-wrap: anywhere;
    }

    .completion-name {
      color: var(--brand-dark);
    }

    .completion-saved {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.6;
      word-break: keep-all;
    }

    .count-status {
      padding: 18px 14px;
      border: 1px solid #b9dbe9;
      border-radius: 15px;
      background: #eef8fc;
      margin-bottom: 16px;
    }
    .count-status h3 { margin: 0; font-size: 1.04rem; line-height: 1.5; word-break: keep-all; color: #135c81; }
    .count-status p { margin: 8px 0 0; font-size: 0.8rem; line-height: 1.6; color: #486779; word-break: keep-all; }
    .count-status[data-state="ready"] { background: #f0f8f3; border-color: #bddbc7; }
    .count-status[data-state="ready"] h3 { color: #246039; font-size: 0.82rem; }
    .count-status[data-state="error"] { background: #f5f7f8; border-color: var(--line); }
    .count-progress { height: 7px; margin-top: 14px; border-radius: 10px; overflow: hidden; background: #d2e7f0; }
    .count-progress::after { content: ''; display: block; width: 40%; height: 100%; border-radius: inherit; background: #1685c5; animation: count-travel 1.7s ease-in-out infinite; }
    @keyframes count-travel {
      from { transform: translateX(-100%); }
      to { transform: translateX(350%); }
    }
    .count-result { margin-top: 8px; color: #183c2a; font-size: 1.08rem; font-weight: 700; }
    .count-result strong { font-size: 2.5rem; line-height: 1.2; margin-right: 3px; }
    .count-retry { width: auto; min-height: 40px; padding: 6px 16px; margin-top: 12px; font-size: 0.86rem; box-shadow: none; }
    .completion-briefing-title { margin: 0 0 9px; text-align: left; color: var(--muted); font-size: 0.73rem; letter-spacing: 0.04em; }
    .completion-info { padding: 14px 16px; margin-bottom: 10px; border-radius: 13px; text-align: left; border: 1px solid var(--line); }
    .completion-info .info-label { display: block; font-size: 0.72rem; margin-bottom: 6px; color: var(--muted); }
    .completion-info strong { font-size: 1.2rem; letter-spacing: -0.03em; }
    .completion-info p { margin: 0; font-size: 0.95rem; line-height: 1.55; word-break: keep-all; }
    .callsign-card { background: #183b4b; color: #fff; border-color: #183b4b; }
    .callsign-card .info-label { color: #bad9e5; }
    .completion-actions { position: sticky; bottom: -18px; padding: 8px 0 0; background: #fff; }
    #completionCloseButton.waiting { background: #fff; color: #5a6e7b; border: 1px solid #c7d4dc; box-shadow: none; font-size: 0.88rem; }
    .completion-panel:focus { outline: none; }
    @media (max-height: 680px) {
      .completion-logo-wrap { display: none; }
      .completion-panel { padding: 16px 14px 12px; }
      .completion-saved { margin-bottom: 10px; font-size: 0.76rem; }
      .count-status { padding: 12px; margin-bottom: 12px; }
      .count-status h3 { font-size: 0.94rem; }
      .completion-info { padding: 10px 12px; margin-bottom: 8px; }
      .completion-actions { bottom: -12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .count-progress::after { width: 100%; opacity: 0.6; }
    }

    .count-pop {
      animation: count-pop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes count-pop {
      from { opacity: 0; transform: scale(0.6); }
      to   { opacity: 1; transform: scale(1); }
    }

    .close-fallback {
      width: min(100%, 520px);
      margin: 0 auto;
      padding: 32px 22px;
      border: 1px solid rgba(217, 226, 232, 0.9);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.96);
      text-align: center;
      box-shadow: 0 18px 45px rgba(42, 75, 94, 0.12);
    }

    .close-fallback strong {
      display: block;
      margin-bottom: 10px;
      font-size: 1.15rem;
    }

    .close-fallback p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    @media (max-width: 360px) {
      .game-item {
        padding: 8px;
      }

      .value {
        font-size: 0.8rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="brand">
      <img class="brand-logo" src="./images/team_k_logo.png" alt="Team-K 로고">
      <h1>Team-K 모바일 출석</h1>
    </header>

    <section class="card">
      <div id="gameInfo" class="game-info" aria-busy="true">
        <div class="game-item">
          <span class="label">게임일자</span>
          <span id="gameDate" class="value">확인 중</span>
        </div>
        <div class="game-item">
          <span class="label">필드명</span>
          <span id="gameField" class="value">확인 중</span>
        </div>
        <div class="game-item">
          <span class="label">게임비</span>
          <span id="gameFee" class="value">확인 중</span>
        </div>
      </div>

      <section id="briefing" class="briefing" aria-labelledby="operationTitle">
        <div class="briefing-label"><span>오늘의 작전</span><span id="seasonTag" class="season-tag">TEAM-K</span></div>
        <h2 id="operationTitle">주말을 사수하라</h2>
        <p id="radioMessage">본부 수신. 오늘도 매너 플레이!</p>
      </section>
      <div id="message" class="message" role="status" aria-live="polite"></div>

      <form id="attendanceForm">
        <div class="field inline">
          <label for="name">성명 <span class="required">(필수)</span></label>
          <input id="name" type="text" maxlength="30" autocomplete="name" placeholder="이름 입력" required>
        </div>
        <label class="check-row minor-row">
          <input id="minor" type="checkbox">
          <span>소인을 함께 등록합니다.</span>
          <select id="minorCount" aria-label="추가할 소인 수" disabled>
            <option value="1">1명</option>
            <option value="2">2명</option>
            <option value="3">3명</option>
            <option value="4">4명</option>
            <option value="5">5명</option>
          </select>
        </label>
        <button id="submitButton" type="submit" disabled>게임 확인 중...</button>
      </form>

      <div id="accountInfo" class="game-item account" hidden>
        <div class="account-info">
          <span class="label">입금계좌</span>
          <span id="gameAccount" class="value"></span>
        </div>
        <button type="button" class="copy-btn" id="copyAccountBtn" aria-label="계좌번호 복사" title="계좌번호 복사">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 1H4C2.9 1 2 1.9 2 3v14h2V3h12V1zm3 4H8C6.9 5 6 5.9 6 7v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
        </button>
      </div>
    </section>
  </main>
  <div id="completionModal" class="completion-modal" role="dialog" aria-modal="true" aria-labelledby="completionTitle" hidden>
    <div id="completionPanel" class="completion-panel" tabindex="-1">
      <div class="completion-logo-wrap">
        <img class="completion-logo" src="./images/team_k_logo.png" alt="Team-K 로고" width="36" height="36">
      </div>
      <h2 id="completionTitle"><span id="completionName" class="completion-name"></span>님 출석완료!</h2>
      <p class="completion-saved">출석은 저장됐어요. 이제 나의 기록을 확인해 보세요.</p>
      <section id="completionCountStatus" class="count-status" data-state="loading" aria-labelledby="completionCountTitle">
        <div role="status" aria-live="polite" aria-atomic="true">
          <h3 id="completionCountTitle">올해 몇 번째 출석인지<br>확인하고 있어요</h3>
          <div id="completionCountText" class="count-result" hidden><strong id="completionCount">-</strong>번째 출석!</div>
          <p id="completionCountDetail">아래 콜사인과 미션을 읽으며 잠시 기다려 주세요.</p>
          <span id="completionBadge" class="completion-badge" hidden></span>
        </div>
        <div id="completionCountProgress" class="count-progress" role="progressbar" aria-label="올해 출석 횟수 확인 중"></div>
        <button id="completionCountRetry" class="count-retry" type="button" hidden>횟수 다시 확인</button>
      </section>
      <h3 class="completion-briefing-title">오늘의 필드 브리핑</h3>
      <div class="completion-info callsign-card">
        <span class="info-label">나의 콜사인</span>
        <strong id="completionCallsign"></strong>
      </div>
      <div class="completion-info">
        <span class="info-label">오늘의 미션</span>
        <p id="completionPhrase"></p>
      </div>
      <div class="completion-actions">
        <button id="completionCloseButton" type="button">닫기</button>
      </div>
    </div>
  </div>
  <section id="closeFallback" class="close-fallback" hidden>
    <strong>출석 등록이 완료되었습니다.</strong>
    <p>이 화면은 자동으로 닫을 수 없습니다.<br>브라우저 탭을 직접 닫아주세요.</p>
  </section>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzPgkd98ZVALSGfY5Z9Q0KbRx1gyo2etlioTR6fpFKmyzO6JbFwQh626L4gCHqtaRxt/exec';
    const PROFILE_KEY = 'teamk_mobile_attendance_profile_v1';
    const PROFILE_COOKIE_KEY = 'teamk_mobile_attendance_name_v1';
    const PROFILE_COOKIE_PATH = `/${window.location.pathname.split('/').filter(Boolean)[0] || ''}`.replace(/\/?$/, '/');
    const query = new URLSearchParams(window.location.search);
    const attendance = {
      spreadsheetId: query.get('spreadsheetId') || '',
      date: query.get('date') || '',
      token: query.get('token') || ''
    };

    // 문구 교체는 이 정적 데이터만 수정합니다. 게임일 기준으로 자동 순환합니다.
    const FUN_CONTENT = {
      seasons: [
        { label: '동계 출동', accent: '#b9e2fa', operations: ['동장군도 출석 체크', '겨울 필드 사수 작전', '추위보다 뜨거운 팀워크', '주말을 사수하라'] },
        { label: '봄 필드 복귀', accent: '#bfe5a0', operations: ['필드에 봄이 왔다', '겨울잠 해제 작전', '봄바람 타고 출동', '스트레스 탈출 작전'] },
        { label: '여름 보급 작전', accent: '#a7ece2', operations: ['수분 보급 이상 무', '더위 탈출 작전', '그늘에서 작전 회의', '주말 에너지 충전'] },
        { label: '가을 필드 데이', accent: '#ffd39a', operations: ['가을 필드를 접수하라', '주말을 사수하라', '팀워크 수확 작전', '스트레스 탈출 작전'] }
      ],
      radio: ['본부 수신. 오늘도 매너 플레이!', '엄폐는 확실하게, 인사는 반갑게!', '탄창은 가득, 걱정은 빈칸!', '히트는 크게, 웃음은 더 크게!', '장비 점검 완료? 재미도 챙기세요.', '오늘의 적은 쌓인 스트레스!', '게임 끝나면 우리 모두 같은 편!', '명중보다 중요한 건 함께하는 주말!'],
      callsigns: ['엄폐 전문가', '탄창 마스터', '필드 단골', '팀워크 대장', '매너 에이스', '주말 수호자', '보급의 달인', '작전 참모'],
      missions: ['오늘 처음 만난 팀원과 인사하기', '멋진 플레이 한 번 칭찬하기', '휴식 시간에 물 한 잔 챙기기', '게임 후 팀원에게 수고했다고 말하기', '장비 점검 한 번 더 하기', '팀원과 즐거운 순간 하나 남기기']
    };
    let attendanceOpen = false;
    let submitting = false;
    let completionRequest = 0;
    let completionName = '';
    let countController = null;
    let countSlowTimer = null;
    let countTimeout = null;

    function contentIndex(value, length) {
      let hash = 0;
      for (let i = 0; i < value.length; i++) hash = (Math.imul(hash, 31) + value.charCodeAt(i)) >>> 0;
      return hash % length;
    }

    function showBriefing() {
      const month = Number(attendance.date.slice(5, 7));
      const day = Math.abs(Math.floor(Date.parse(attendance.date + 'T00:00:00Z') / 86400000) || 0);
      const season = FUN_CONTENT.seasons[month >= 3 && month <= 5 ? 1 : month >= 6 && month <= 8 ? 2 : month >= 9 && month <= 11 ? 3 : 0];
      document.getElementById('seasonTag').textContent = season.label;
      document.getElementById('briefing').style.setProperty('--season-accent', season.accent);
      document.getElementById('operationTitle').textContent = season.operations[day % season.operations.length];
      document.getElementById('radioMessage').textContent = FUN_CONTENT.radio[day % FUN_CONTENT.radio.length];
    }

    const form = document.getElementById('attendanceForm');
    const dom = {
      message: document.getElementById('message'),
      submitButton: document.getElementById('submitButton'),
      name: document.getElementById('name'),
      minor: document.getElementById('minor'),
      minorCount: document.getElementById('minorCount'),
      gameInfo: document.getElementById('gameInfo'),
      gameDate: document.getElementById('gameDate'),
      gameField: document.getElementById('gameField'),
      gameFee: document.getElementById('gameFee'),
      gameAccount: document.getElementById('gameAccount'),
      completionModal: document.getElementById('completionModal'),
      completionCloseButton: document.getElementById('completionCloseButton'),
      closeFallback: document.getElementById('closeFallback'),
      shell: document.querySelector('.shell')
    };

    function showMessage(text, type) {
      dom.message.textContent = text;
      dom.message.className = `message ${type} visible`;
      dom.message.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function setSubmitting(isSubmitting) {
      submitting = isSubmitting;
      dom.submitButton.disabled = isSubmitting || !attendanceOpen;
      dom.submitButton.textContent = isSubmitting ? '등록 중...' : attendanceOpen ? '출석 등록' : '접수 불가';
      dom.name.disabled = isSubmitting;
      dom.minor.disabled = isSubmitting;
      dom.minorCount.disabled = isSubmitting || !dom.minor.checked;
    }

    function readJsonResponse(response) {
      if (!response.ok) {
        throw new Error(`서버 응답 오류 (${response.status})`);
      }
      return response.text().then(text => {
        try {
          return JSON.parse(text);
        } catch (error) {
          throw new Error('서버 응답을 확인할 수 없습니다.');
        }
      });
    }

    function requestAttendanceInfo() {
      const params = new URLSearchParams({
        action: 'mobile_attendance_info',
        spreadsheetId: attendance.spreadsheetId,
        date: attendance.date,
        token: attendance.token,
        timestamp: Date.now().toString()
      });
      return fetch(`${APPS_SCRIPT_URL}?${params.toString()}`, {
        cache: 'no-store',
        credentials: 'omit',
        redirect: 'follow'
      }).then(readJsonResponse);
    }

    function submitAttendance(payload) {
      return fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        credentials: 'omit',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).then(readJsonResponse);
    }

    function readProfileCookie() {
      const prefix = `${PROFILE_COOKIE_KEY}=`;
      const cookie = document.cookie.split('; ').find(item => item.startsWith(prefix));
      if (!cookie) return '';
      try {
        return decodeURIComponent(cookie.slice(prefix.length)).trim();
      } catch (error) {
        return '';
      }
    }

    function writeProfileCookie(name) {
      const secure = window.location.protocol === 'https:' ? '; Secure' : '';
      document.cookie = `${PROFILE_COOKIE_KEY}=${encodeURIComponent(name)}; Max-Age=31536000; Path=${PROFILE_COOKIE_PATH}; SameSite=Lax${secure}`;
    }

    function removeProfileCookie() {
      document.cookie = `${PROFILE_COOKIE_KEY}=; Max-Age=0; Path=${PROFILE_COOKIE_PATH}; SameSite=Lax`;
    }

    function readSavedProfile() {
      let name = '';
      try {
        const profile = JSON.parse(localStorage.getItem(PROFILE_KEY) || 'null');
        name = profile && typeof profile.name === 'string'
          ? profile.name.trim()
          : '';
      } catch (error) {
        try {
          localStorage.removeItem(PROFILE_KEY);
        } catch (storageError) {
          // Browser privacy settings can disable local storage.
        }
      }
      name = name || readProfileCookie();
      if (!name) {
        removeSavedProfile();
        return;
      }
      dom.name.value = name;
      try {
        localStorage.setItem(PROFILE_KEY, JSON.stringify({ name }));
      } catch (error) {
        // The cookie remains available when embedded browsers isolate local storage.
      }
    }

    function removeSavedProfile() {
      try {
        localStorage.removeItem(PROFILE_KEY);
      } catch (error) {
        // Browser privacy settings can disable local storage.
      }
      removeProfileCookie();
    }

    function persistRememberedName() {
      const name = dom.name.value.trim();
      if (!name) {
        removeSavedProfile();
        return;
      }
      try {
        localStorage.setItem(PROFILE_KEY, JSON.stringify({ name }));
      } catch (error) {
        // The cookie is the fallback for embedded browsers.
      }
      writeProfileCookie(name);
    }

    function renderAttendanceInfo(result) {
      if (!result.success) {
        throw new Error(result.error || '출석 정보를 확인할 수 없습니다.');
      }
      dom.gameDate.textContent = result.date || attendance.date;
      dom.gameField.textContent = result.field || '-';
      dom.gameField.title = result.field || '';
      dom.gameFee.textContent = result.fee ? `${result.fee}원` : '-';
      dom.gameAccount.textContent = result.account || '-';
      dom.gameInfo.setAttribute('aria-busy', 'false');
      document.getElementById('accountInfo').hidden = !result.account;
      attendanceOpen = Boolean(result.open);
      setSubmitting(false);
      if (!result.open) {
        showMessage(result.message || '모바일 출석 접수가 마감되었습니다.', 'error');
        return;
      }
      dom.message.className = 'message';
    }

    function initialize() {
      readSavedProfile();
      showBriefing();
      if (!attendance.spreadsheetId || !attendance.date || !attendance.token) {
        dom.gameInfo.setAttribute('aria-busy', 'false');
        setSubmitting(false);
        showMessage('QR 주소에 필요한 정보가 없습니다. 운영진에게 새 QR을 요청해주세요.', 'error');
        return;
      }

      requestAttendanceInfo()
        .then(renderAttendanceInfo)
        .catch(error => {
          dom.gameInfo.setAttribute('aria-busy', 'false');
          setSubmitting(false);
          showMessage(error.message || '출석 정보를 불러오지 못했습니다.', 'error');
        });
    }

    dom.name.addEventListener('input', persistRememberedName);
    window.addEventListener('pagehide', persistRememberedName);
    dom.minor.addEventListener('change', event => {
      dom.minorCount.disabled = !event.target.checked;
    });

    function stopCountLookup() {
      clearTimeout(countSlowTimer);
      clearTimeout(countTimeout);
      countSlowTimer = null;
      countTimeout = null;
      if (countController) countController.abort();
      countController = null;
    }

    function displayCompletionCount(value, requestId) {
      if (requestId !== completionRequest) return;
      // 완료/실패/시간 초과 뒤 도착하는 이전 응답은 화면을 다시 바꾸지 않습니다.
      completionRequest++;
      stopCountLookup();
      const count = Number(value);
      const valid = Number.isInteger(count) && count > 0;
      document.getElementById('completionCountStatus').setAttribute('data-state', valid ? 'ready' : 'error');
      document.getElementById('completionCountTitle').textContent = valid ? '올해 쌓은 나의 출석 기록' : '출석 횟수를 불러오지 못했어요';
      document.getElementById('completionCountText').hidden = !valid;
      document.getElementById('completionCount').textContent = valid ? String(count) : '-';
      document.getElementById('completionCountProgress').hidden = true;
      document.getElementById('completionCountRetry').hidden = valid;
      document.getElementById('completionCountDetail').textContent = valid
        ? '오늘도 함께해 주셔서 감사합니다. 필드에서 만나요!'
        : '출석 등록은 완료됐어요. 다시 조회하거나 지금 닫아도 괜찮아요.';
      dom.completionCloseButton.classList.remove('waiting');
      dom.completionCloseButton.textContent = valid ? '확인했어요 · 닫기' : '닫기';
      if (valid) document.getElementById('completionCount').classList.add('count-pop');
      const labels = { 1: '첫 출동 완료', 5: '5회 출석 · 필드 적응 완료', 10: '10회 출석 · 필드 단골', 20: '20회 출석 · 팀워크 베테랑', 30: '30회 출석 · 주말 수호자', 50: '50회 출석 · Team-K 레전드' };
      const badge = document.getElementById('completionBadge');
      badge.textContent = valid ? labels[count] || '' : '';
      badge.hidden = !badge.textContent;
    }

    function loadCompletionCount(name, initialValue) {
      const requestId = ++completionRequest;
      stopCountLookup();
      document.getElementById('completionCountStatus').setAttribute('data-state', 'loading');
      document.getElementById('completionCountTitle').textContent = '올해 몇 번째 출석인지 확인하고 있어요';
      document.getElementById('completionCountDetail').textContent = '아래 콜사인과 미션을 읽으며 잠시 기다려 주세요.';
      document.getElementById('completionCountText').hidden = true;
      document.getElementById('completionCount').classList.remove('count-pop');
      document.getElementById('completionCountProgress').hidden = false;
      document.getElementById('completionCountRetry').hidden = true;
      document.getElementById('completionBadge').hidden = true;
      dom.completionCloseButton.classList.add('waiting');
      dom.completionCloseButton.textContent = '기다리지 않고 닫기';
      if (Number.isInteger(Number(initialValue)) && Number(initialValue) > 0) {
        displayCompletionCount(initialValue, requestId);
        return;
      }
      countSlowTimer = setTimeout(() => {
        if (requestId === completionRequest) {
          document.getElementById('completionCountDetail').textContent = '조회가 조금 늦어지고 있어요. 출석은 이미 저장됐어요.';
        }
      }, 7000);
      countTimeout = setTimeout(() => displayCompletionCount(0, requestId), 30000);
      countController = typeof AbortController === 'function' ? new AbortController() : null;
      const params = new URLSearchParams({
        action: 'mobile_attendance_info',
        spreadsheetId: attendance.spreadsheetId,
        date: attendance.date,
        token: attendance.token,
        includeYearlyCount: name,
        timestamp: Date.now().toString()
      });
      fetch(`${APPS_SCRIPT_URL}?${params.toString()}`, {
        cache: 'no-store', credentials: 'omit', redirect: 'follow',
        signal: countController ? countController.signal : undefined
      }).then(readJsonResponse).then(result => {
        displayCompletionCount(result.success ? result.yearlyCount : 0, requestId);
      }).catch(() => displayCompletionCount(0, requestId));
    }

    document.getElementById('completionCountRetry').addEventListener('click', () => {
      if (dom.completionModal.hidden) return;
      loadCompletionCount(completionName);
      document.getElementById('completionPanel').focus();
    });

    function closeMobileAttendance() {
      completionRequest++;
      stopCountLookup();
      dom.completionModal.hidden = true;
      dom.shell.inert = false;
      dom.shell.hidden = true;
      dom.closeFallback.hidden = false;
      window.close();
    }

    dom.completionCloseButton.addEventListener('click', closeMobileAttendance);
    window.addEventListener('pagehide', () => { completionRequest++; stopCountLookup(); });

    document.getElementById('copyAccountBtn').addEventListener('click', () => {
      const accountText = dom.gameAccount.textContent || '';
      const match = accountText.match(/[\d-]+/g);
      let accNum = '';
      if (match) {
        accNum = match.reduce((a, b) => a.length > b.length ? a : b, '');
      }
      if (accNum && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(accNum).then(() => {
          showMessage('계좌번호가 복사되었습니다.', 'success');
        }).catch(() => {
          showMessage('복사 기능을 지원하지 않는 환경입니다.', 'error');
        });
      } else {
        showMessage('계좌번호를 길게 눌러 복사해주세요.', 'info');
      }
    });

    form.addEventListener('submit', event => {
      event.preventDefault();
      if (!attendanceOpen || submitting) return;
      const name = dom.name.value.trim();
      if (!name) {
        showMessage('성명을 입력해주세요.', 'error');
        dom.name.focus();
        return;
      }
      persistRememberedName();
      setSubmitting(true);
      const payload = {
        type: 'submit_mobile_attendance',
        spreadsheetId: attendance.spreadsheetId,
        date: attendance.date,
        token: attendance.token,
        name,
        team: 'Team-K',
        minorCount: dom.minor.checked
          ? parseInt(dom.minorCount.value, 10)
          : 0,
        note: '',
        skipYearlyCount: true  // 연간 횟수 계산 생략 → 응답 속도 최적화
      };
      submitAttendance(payload).then(result => {
        if (!result.success) {
          throw new Error(result.error || '출석 등록에 실패했습니다.');
        }
        setSubmitting(false);
        showMessage('출석 등록이 완료되었습니다. 운영진 출석부에 곧 반영됩니다.', 'success');

        // 출석 성공은 먼저 표시하고 연간 기록은 별도로 조회합니다.
        completionName = name;
        document.getElementById('completionName').textContent = name;
        const seed = attendance.date + '|' + name;
        document.getElementById('completionCallsign').textContent = FUN_CONTENT.callsigns[contentIndex(seed, FUN_CONTENT.callsigns.length)];
        document.getElementById('completionPhrase').textContent = FUN_CONTENT.missions[contentIndex(seed, FUN_CONTENT.missions.length)];
        dom.completionModal.hidden = false;
        dom.shell.inert = true;
        loadCompletionCount(name, result.yearlyCount);
        document.getElementById('completionPanel').focus();
      }).catch(error => {
        setSubmitting(false);
        showMessage(error.message || '통신 중 오류가 발생했습니다.', 'error');
      });
    });

    initialize();
  </script>
</body>
</html>
