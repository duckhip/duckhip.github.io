<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d6598">
  <title>Team-K 모바일 출석</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #183042;
      --muted: #667784;
      --line: #d9e2e8;
      --brand: #1685c5;
      --brand-dark: #0d6598;
      --success: #238636;
      --danger: #b42318;
      --canvas: #edf5f9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(10px, env(safe-area-inset-top)) 10px max(16px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at top right, rgba(22, 133, 197, 0.18), transparent 34%),
        linear-gradient(180deg, #f8fcff, var(--canvas));
      color: var(--ink);
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    .shell {
      width: min(100%, 520px);
      margin: 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 10px 0 16px;
    }

    .brand-logo {
      width: 1.45rem;
      height: 1.45rem;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      font-size: 1.45rem;
      letter-spacing: -0.04em;
    }

    .card {
      overflow: hidden;
      border: 1px solid rgba(217, 226, 232, 0.9);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 18px 45px rgba(42, 75, 94, 0.12);
    }

    .game-info {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      background: var(--line);
      border-bottom: 1px solid var(--line);
    }

    .game-item {
      min-width: 0;
      padding: 9px 10px;
      background: #f7fbfd;
    }

    .game-item.account {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      white-space: nowrap;
    }

    .game-item.account .account-info {
      flex: 1 1 auto;
      min-width: 0;
    }

    .copy-btn {
      flex: 0 0 auto;
      margin-top: 0;
      margin-left: 10px;
      width: 32px;
      height: 32px;
      min-height: 0;
      padding: 0;
      border-radius: 8px;
      background: rgba(22, 133, 197, 0.1);
      color: var(--brand);
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .copy-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 0.76rem;
    }

    .value {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.88rem;
      font-weight: 700;
    }

    form {
      padding: 12px 14px 14px;
    }

    .field {
      margin-bottom: 10px;
    }

    .field.inline {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .field.inline label {
      margin-bottom: 0;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .required {
      color: var(--danger);
      font-size: 0.82em;
    }

    input[type="text"] {
      width: 100%;
      min-height: 49px;
      padding: 12px 13px;
      border: 1px solid #bfcbd3;
      border-radius: 11px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      outline: none;
    }

    .field.inline input[type="text"] {
      flex: 1 1 auto;
      min-width: 0;
    }

    input[type="text"]:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(22, 133, 197, 0.13);
    }

    .check-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 9px 0;
      color: #405463;
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .check-row input {
      width: 20px;
      height: 20px;
      margin: 0;
      flex: 0 0 auto;
      accent-color: var(--brand);
    }

    .minor-row {
      align-items: center;
    }

    .minor-row select {
      min-height: 38px;
      margin-left: auto;
      padding: 7px 30px 7px 10px;
      border: 1px solid #bfcbd3;
      border-radius: 9px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 16px;
    }

    button {
      width: 100%;
      min-height: 48px;
      margin-top: 5px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      color: #fff;
      font: inherit;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 9px 20px rgba(13, 101, 152, 0.2);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.58;
    }

    .message {
      display: none;
      margin: 16px 18px 0;
      padding: 13px;
      border-radius: 11px;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .message.visible {
      display: block;
    }

    .message.error {
      background: #fff0ee;
      color: var(--danger);
    }

    .message.success {
      background: #eaf7ed;
      color: var(--success);
    }

    .message.info {
      background: #eef7fc;
      color: var(--brand-dark);
    }

    .profile-settings {
      margin: 0 14px 14px;
      padding: 14px;
      border: 1px solid #cfe1eb;
      border-radius: 12px;
      background: #f4fafc;
    }

    .profile-settings .check-row {
      margin: 0 0 6px 0;
    }

    .profile-settings .privacy {
      margin: 0;
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.4;
    }

    .saved-profile {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed #cfe1eb;
      color: #46606f;
      font-size: 0.84rem;
    }

    .saved-profile.visible {
      display: flex;
    }

    .saved-profile button {
      width: auto;
      min-height: 34px;
      margin: 0;
      padding: 6px 10px;
      border: 1px solid #b9cbd5;
      background: #fff;
      color: #506674;
      font-size: 0.78rem;
      box-shadow: none;
    }

    [hidden] {
      display: none !important;
    }

    .completion-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(14, 30, 44, 0.65);
      backdrop-filter: blur(4px);
    }

    .completion-modal[hidden] {
      display: none;
    }

    .completion-panel {
      width: min(100%, 360px);
      padding: 28px 24px 24px;
      border-radius: 22px;
      background: #fff;
      text-align: center;
      box-shadow: 0 28px 70px rgba(14, 30, 44, 0.30);
      animation: panel-pop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes panel-pop {
      from { opacity: 0; transform: scale(0.88) translateY(12px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .completion-logo-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 76px;
      height: 76px;
      margin-bottom: 14px;
    }

    .completion-logo-wrap::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(var(--brand), #63d4ff, var(--brand));
      animation: spin-ring 3s linear infinite;
      opacity: 0.55;
    }

    @keyframes spin-ring {
      to { transform: rotate(360deg); }
    }

    .completion-logo-wrap::after {
      content: '';
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      background: #fff;
    }

    .completion-logo {
      position: relative;
      z-index: 1;
      width: 60px;
      height: 60px;
      object-fit: contain;
    }

    .completion-check {
      display: block;
      margin: 0 auto 4px;
      font-size: 1.6rem;
    }

    .completion-panel h2 {
      margin: 0 0 6px;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.03em;
    }

    .completion-name {
      color: var(--brand-dark);
    }

    .completion-panel .completion-sub {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.6;
    }

    .completion-panel .completion-sub strong {
      color: var(--brand-dark);
      font-weight: 800;
    }

    .close-fallback {
      width: min(100%, 520px);
      margin: 0 auto;
      padding: 32px 22px;
      border: 1px solid rgba(217, 226, 232, 0.9);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.96);
      text-align: center;
      box-shadow: 0 18px 45px rgba(42, 75, 94, 0.12);
    }

    .close-fallback strong {
      display: block;
      margin-bottom: 10px;
      font-size: 1.15rem;
    }

    .close-fallback p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    @media (max-width: 360px) {
      .game-item {
        padding: 8px;
      }

      .value {
        font-size: 0.8rem;
      }
    }

    /* ── 스켈레톤 로더 ── */
    .skeleton-wrap {
      padding: 16px 18px 18px;
    }

    .skeleton {
      border-radius: 8px;
      background: linear-gradient(90deg, #e8eff4 25%, #d4e3ec 50%, #e8eff4 75%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.4s infinite;
    }

    .skeleton-line {
      height: 14px;
      margin-bottom: 10px;
    }

    .skeleton-line.short { width: 45%; }
    .skeleton-line.long  { width: 85%; }

    .skeleton-box {
      height: 52px;
      margin-bottom: 12px;
    }

    .skeleton-btn {
      height: 48px;
    }

    @keyframes skeleton-shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── 스켈레톤 → 폼 페이드인 ── */
    #attendanceForm.form-ready {
      animation: form-fadein 0.25s ease;
    }

    @keyframes form-fadein {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="brand">
      <img class="brand-logo" src="./images/team_k_logo.png" alt="Team-K 로고">
      <h1>Team-K 모바일 출석</h1>
    </header>

    <section class="card" aria-live="polite">
      <div id="message" class="message"></div>

      <!-- 스켈레톤 로더: 서버 응답 전 표시 -->
      <div id="skeletonLoader" class="skeleton-wrap">
        <div class="skeleton skeleton-line short"></div>
        <div class="skeleton skeleton-line long"></div>
        <div class="skeleton skeleton-box"></div>
        <div class="skeleton skeleton-line short"></div>
        <div class="skeleton skeleton-btn"></div>
      </div>

      <div id="gameInfo" class="game-info" hidden>
        <div class="game-item">
          <span class="label">게임일자</span>
          <span id="gameDate" class="value"></span>
        </div>
        <div class="game-item">
          <span class="label">필드명</span>
          <span id="gameField" class="value"></span>
        </div>
        <div class="game-item">
          <span class="label">게임비</span>
          <span id="gameFee" class="value"></span>
        </div>
        <div class="game-item account">
          <div class="account-info">
            <span class="label">입금계좌</span>
            <span id="gameAccount" class="value"></span>
          </div>
          <button type="button" class="copy-btn" id="copyAccountBtn" aria-label="계좌번호 복사" title="계좌번호 복사">
            <svg viewBox="0 0 24 24"><path d="M16 1H4C2.9 1 2 1.9 2 3v14h2V3h12V1zm3 4H8C6.9 5 6 5.9 6 7v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
          </button>
        </div>
      </div>

      <form id="attendanceForm" hidden>
        <div class="field inline">
          <label for="name">성명 <span class="required">(필수)</span></label>
          <input id="name" type="text" maxlength="30" autocomplete="name" placeholder="이름 입력" required>
        </div>
        <label class="check-row minor-row">
          <input id="minor" type="checkbox">
          <span>소인을 함께 등록합니다.</span>
          <select id="minorCount" aria-label="추가할 소인 수" disabled>
            <option value="1">1명</option>
            <option value="2">2명</option>
            <option value="3">3명</option>
            <option value="4">4명</option>
            <option value="5">5명</option>
          </select>
        </label>
        <button id="submitButton" type="submit">출석 등록</button>
      </form>

      <div class="profile-settings" id="profileSettings" hidden>
        <label class="check-row">
          <input id="remember" type="checkbox" checked>
          <span>다음 출석 때 이름을 자동으로 입력합니다.</span>
        </label>
        <p class="privacy">저장 동의 시 이름이 브라우저에만 저장됩니다. 공용 기기에서는 선택을 해제하세요.</p>
        <div id="savedProfile" class="saved-profile">
          <span>저장된 사용자 정보가 적용되었습니다.</span>
          <button id="clearProfileButton" type="button">저장정보 삭제</button>
        </div>
      </div>
    </section>
  </main>
  <div id="completionModal" class="completion-modal" role="dialog" aria-modal="true" aria-labelledby="completionTitle" hidden>
    <div class="completion-panel">
      <div class="completion-logo-wrap">
        <img class="completion-logo" src="./images/team_k_logo.png" alt="Team-K 로고" width="60" height="60">
      </div>
      <h2 id="completionTitle"><span id="completionName" class="completion-name"></span>님 출석완료!</h2>
      <p id="completionSub" class="completion-sub">올해 <strong id="completionCount">-</strong>번째 게임 참석하였어요.<br>더 자주 만나요.</p>
      <button id="completionCloseButton" type="button">닫기</button>
    </div>
  </div>
  <section id="closeFallback" class="close-fallback" hidden>
    <strong>출석 등록이 완료되었습니다.</strong>
    <p>이 화면은 자동으로 닫을 수 없습니다.<br>브라우저 탭을 직접 닫아주세요.</p>
  </section>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzPgkd98ZVALSGfY5Z9Q0KbRx1gyo2etlioTR6fpFKmyzO6JbFwQh626L4gCHqtaRxt/exec';
    const PROFILE_KEY = 'teamk_mobile_attendance_profile_v1';
    const PROFILE_COOKIE_KEY = 'teamk_mobile_attendance_name_v1';
    const PROFILE_COOKIE_PATH = `/${window.location.pathname.split('/').filter(Boolean)[0] || ''}`.replace(/\/?$/, '/');
    const query = new URLSearchParams(window.location.search);
    const attendance = {
      spreadsheetId: query.get('spreadsheetId') || '',
      date: query.get('date') || '',
      token: query.get('token') || ''
    };

    const form = document.getElementById('attendanceForm');
    const dom = {
      message: document.getElementById('message'),
      submitButton: document.getElementById('submitButton'),
      name: document.getElementById('name'),
      minor: document.getElementById('minor'),
      minorCount: document.getElementById('minorCount'),
      remember: document.getElementById('remember'),
      savedProfile: document.getElementById('savedProfile'),
      gameInfo: document.getElementById('gameInfo'),
      gameDate: document.getElementById('gameDate'),
      gameField: document.getElementById('gameField'),
      gameFee: document.getElementById('gameFee'),
      gameAccount: document.getElementById('gameAccount'),
      completionModal: document.getElementById('completionModal'),
      completionCloseButton: document.getElementById('completionCloseButton'),
      closeFallback: document.getElementById('closeFallback'),
      skeletonLoader: document.getElementById('skeletonLoader'),
      shell: document.querySelector('.shell')
    };

    function showMessage(text, type) {
      dom.message.textContent = text;
      dom.message.className = `message ${type} visible`;
      dom.message.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function setSubmitting(isSubmitting) {
      dom.submitButton.disabled = isSubmitting;
      dom.submitButton.textContent = isSubmitting ? '등록 중...' : '출석 등록';
    }

    function readJsonResponse(response) {
      if (!response.ok) {
        throw new Error(`서버 응답 오류 (${response.status})`);
      }
      return response.text().then(text => {
        try {
          return JSON.parse(text);
        } catch (error) {
          throw new Error('서버 응답을 확인할 수 없습니다.');
        }
      });
    }

    function requestAttendanceInfo() {
      const params = new URLSearchParams({
        action: 'mobile_attendance_info',
        spreadsheetId: attendance.spreadsheetId,
        date: attendance.date,
        token: attendance.token,
        timestamp: Date.now().toString()
      });
      return fetch(`${APPS_SCRIPT_URL}?${params.toString()}`, {
        cache: 'no-store',
        credentials: 'omit',
        redirect: 'follow'
      }).then(readJsonResponse);
    }

    function submitAttendance(payload) {
      return fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        credentials: 'omit',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).then(readJsonResponse);
    }

    function readProfileCookie() {
      const prefix = `${PROFILE_COOKIE_KEY}=`;
      const cookie = document.cookie.split('; ').find(item => item.startsWith(prefix));
      if (!cookie) return '';
      try {
        return decodeURIComponent(cookie.slice(prefix.length)).trim();
      } catch (error) {
        return '';
      }
    }

    function writeProfileCookie(name) {
      const secure = window.location.protocol === 'https:' ? '; Secure' : '';
      document.cookie = `${PROFILE_COOKIE_KEY}=${encodeURIComponent(name)}; Max-Age=31536000; Path=${PROFILE_COOKIE_PATH}; SameSite=Lax${secure}`;
    }

    function removeProfileCookie() {
      document.cookie = `${PROFILE_COOKIE_KEY}=; Max-Age=0; Path=${PROFILE_COOKIE_PATH}; SameSite=Lax`;
    }

    function readSavedProfile() {
      let name = '';
      try {
        const profile = JSON.parse(localStorage.getItem(PROFILE_KEY) || 'null');
        name = profile && typeof profile.name === 'string'
          ? profile.name.trim()
          : '';
      } catch (error) {
        try {
          localStorage.removeItem(PROFILE_KEY);
        } catch (storageError) {
          // Browser privacy settings can disable local storage.
        }
      }
      name = name || readProfileCookie();
      if (!name) {
        removeSavedProfile();
        return;
      }
      dom.name.value = name;
      dom.remember.checked = true;
      dom.savedProfile.classList.add('visible');
      try {
        localStorage.setItem(PROFILE_KEY, JSON.stringify({ name }));
      } catch (error) {
        // The cookie remains available when embedded browsers isolate local storage.
      }
    }

    function removeSavedProfile() {
      try {
        localStorage.removeItem(PROFILE_KEY);
      } catch (error) {
        // Browser privacy settings can disable local storage.
      }
      removeProfileCookie();
      dom.savedProfile.classList.remove('visible');
    }

    function persistRememberedName() {
      const name = dom.name.value.trim();
      if (!dom.remember.checked || !name) {
        removeSavedProfile();
        return;
      }
      try {
        localStorage.setItem(PROFILE_KEY, JSON.stringify({ name }));
      } catch (error) {
        // The cookie is the fallback for embedded browsers.
      }
      writeProfileCookie(name);
      dom.savedProfile.classList.add('visible');
    }

    function clearSavedProfile() {
      removeSavedProfile();
      dom.name.value = '';
      dom.remember.checked = false;
      dom.name.focus();
    }

    function hideSkeleton() {
      if (dom.skeletonLoader) dom.skeletonLoader.hidden = true;
    }

    function renderAttendanceInfo(result) {
      hideSkeleton();
      if (!result.success) {
        throw new Error(result.error || '출석 정보를 확인할 수 없습니다.');
      }
      dom.gameDate.textContent = result.date || attendance.date;
      dom.gameField.textContent = result.field || '-';
      dom.gameFee.textContent = result.fee ? `${result.fee}원` : '-';
      dom.gameAccount.textContent = result.account || '-';
      dom.gameInfo.hidden = false;
      if (!result.open) {
        showMessage(result.message || '모바일 출석 접수가 마감되었습니다.', 'error');
        return;
      }
      dom.message.className = 'message';
      form.classList.add('form-ready');
      form.hidden = false;
      document.getElementById('profileSettings').hidden = false;
      readSavedProfile();
      dom.name.focus();
    }

    function initialize() {
      if (!attendance.spreadsheetId || !attendance.date || !attendance.token) {
        hideSkeleton();
        showMessage('QR 주소에 필요한 정보가 없습니다. 운영진에게 새 QR을 요청해주세요.', 'error');
        return;
      }

      // 2번: 저장된 이름을 서버 응답과 병렬로 즉시 이름 입력창에 채움
      // 쿠키를 우선 읽고, 없으면 localStorage 시도 (ITP 대응)
      const prefilledName = readProfileCookie() || (() => {
        try {
          const p = JSON.parse(localStorage.getItem(PROFILE_KEY) || 'null');
          return (p && typeof p.name === 'string') ? p.name.trim() : '';
        } catch (e) { return ''; }
      })();
      if (prefilledName) {
        dom.name.value = prefilledName;
      }

      requestAttendanceInfo()
        .then(renderAttendanceInfo)
        .catch(error => {
          hideSkeleton();
          showMessage(error.message || '출석 정보를 불러오지 못했습니다.', 'error');
        });
    }

    document.getElementById('clearProfileButton').addEventListener('click', clearSavedProfile);
    dom.name.addEventListener('input', persistRememberedName);
    dom.remember.addEventListener('change', persistRememberedName);
    window.addEventListener('pagehide', persistRememberedName);
    dom.minor.addEventListener('change', event => {
      dom.minorCount.disabled = !event.target.checked;
    });

    function closeMobileAttendance() {
      dom.completionModal.hidden = true;
      dom.shell.hidden = true;
      dom.closeFallback.hidden = false;
      window.close();
    }

    dom.completionCloseButton.addEventListener('click', closeMobileAttendance);

    document.getElementById('copyAccountBtn').addEventListener('click', () => {
      const accountText = dom.gameAccount.textContent || '';
      const match = accountText.match(/[\d-]+/g);
      let accNum = '';
      if (match) {
        accNum = match.reduce((a, b) => a.length > b.length ? a : b, '');
      }
      if (accNum) {
        navigator.clipboard.writeText(accNum).then(() => {
          showMessage('계좌번호가 복사되었습니다.', 'success');
        }).catch(() => {
          showMessage('복사 기능을 지원하지 않는 환경입니다.', 'error');
        });
      }
    });

    form.addEventListener('submit', event => {
      event.preventDefault();
      const name = dom.name.value.trim();
      if (!name) {
        showMessage('성명을 입력해주세요.', 'error');
        dom.name.focus();
        return;
      }
      persistRememberedName();
      setSubmitting(true);
      submitAttendance({
        type: 'submit_mobile_attendance',
        spreadsheetId: attendance.spreadsheetId,
        date: attendance.date,
        token: attendance.token,
        name,
        team: 'Team-K',
        minorCount: dom.minor.checked
          ? parseInt(dom.minorCount.value, 10)
          : 0,
        note: ''
      }).then(result => {
        if (!result.success) {
          throw new Error(result.error || '출석 등록에 실패했습니다.');
        }
        setSubmitting(false);
        showMessage('출석 등록이 완료되었습니다. 운영진 출석부에 곧 반영됩니다.', 'success');
        // 완료 팝업: 이름 및 올해 참석 횟수 표시
        document.getElementById('completionName').textContent = name;
        const yearlyCount = result.yearlyCount;
        const countEl = document.getElementById('completionCount');
        const subEl = document.getElementById('completionSub');
        if (yearlyCount && yearlyCount > 0) {
          countEl.textContent = yearlyCount;
          subEl.hidden = false;
        } else {
          subEl.hidden = true;
        }
        dom.completionModal.hidden = false;
        dom.completionCloseButton.focus();
      }).catch(error => {
        setSubmitting(false);
        showMessage(error.message || '통신 중 오류가 발생했습니다.', 'error');
      });
    });

    initialize();
  </script>
</body>
</html>
