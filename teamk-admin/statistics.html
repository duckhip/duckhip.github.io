<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#123746">
  <title>Team-K 통계 (모바일)</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  <style>
    .stats-container {
      padding: 10px;
    }
    .chart-card {
      margin-top: 15px;
      padding: 15px;
    }
    .chart-wrapper {
      position: relative;
      height: 250px;
      width: 100%;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }
    .stat-row:last-child {
      border-bottom: none;
    }
    .ranking-list {
      margin-top: 10px;
    }
    .ranking-item {
      display: grid;
      grid-template-columns: 30px 1fr 50px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-bottom: 5px;
      background: #fbfdfd;
      align-items: center;
    }
    .ranking-rank {
      font-weight: bold;
      color: var(--brand);
    }
    .ranking-count {
      text-align: right;
      color: var(--muted);
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <span class="eyebrow">TEAM-K</span>
      <h1>출석 통계</h1>
    </div>
    <button id="backButton" class="ghost">뒤로</button>
  </header>

  <main class="stats-container">
    <div id="loadingMessage" class="message info visible" style="margin-top: 20px;">
      통계 데이터를 불러오는 중입니다...
    </div>

    <div id="statsContent" hidden>
      <section class="summary-grid">
        <article><span>전체 게임</span><strong id="totalGames">0</strong></article>
        <article><span>총 참석</span><strong id="totalAttendees">0</strong></article>
        <article><span>평균 참석</span><strong id="avgAttendees">0</strong></article>
      </section>

      <section class="card chart-card">
        <h2>월별/분기별 참석 추이</h2>
        <div class="chart-wrapper">
          <canvas id="monthlyChart"></canvas>
        </div>
      </section>

      <section class="card chart-card">
        <h2>필드별 참석 현황</h2>
        <div class="chart-wrapper">
          <canvas id="fieldChart"></canvas>
        </div>
      </section>

      <section class="card chart-card">
        <h2>출석 랭킹 (Top 10)</h2>
        <div id="rankingList" class="ranking-list">
          <!-- 랭킹 항목이 여기에 추가됩니다 -->
        </div>
      </section>
    </div>
  </main>

  <script src="./api.js"></script>
  <script src="./domain.js"></script>
  <script src="./statistics.js"></script>
</body>
</html>
