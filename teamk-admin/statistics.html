<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#123746">
  <title>Team-K 통계 (모바일)</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  <style>
    .stats-container {
      padding: 10px;
    }
    .chart-card {
      margin-top: 15px;
      padding: 15px;
    }
    .statistics-toolbar {
      margin-bottom: 14px;
      padding: 12px 16px;
    }
    .statistics-toolbar label {
      grid-template-columns: auto minmax(120px, 180px);
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .statistics-summary .game-meta {
      display: block;
      margin-top: 6px;
      color: #aed2d5;
      font-size: .875rem;
      line-height: 1.45;
      white-space: pre-line;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    .chart-wrapper {
      position: relative;
      height: 250px;
      width: 100%;
    }
    .field-average-legend {
      margin: 12px 0 0;
      padding: 0;
      list-style: none;
    }
    .field-average-legend li {
      display: grid;
      grid-template-columns: 12px minmax(0, 1fr) auto;
      align-items: start;
      gap: 8px;
      padding: 6px 0;
      font-size: .875rem;
    }
    .field-average-legend .swatch {
      width: 12px;
      height: 12px;
      margin-top: 4px;
      border-radius: 2px;
    }
    .field-average-legend .field-name {
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .field-average-legend .average-value {
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }
    .stat-row:last-child {
      border-bottom: none;
    }
    .ranking-list {
      margin-top: 10px;
    }
    .ranking-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-bottom: 5px;
      background: #fbfdfd;
      overflow: hidden;
    }
    .ranking-item summary {
      padding: 10px;
      cursor: pointer;
    }
    .ranking-item summary:focus-visible {
      outline: 3px solid var(--teal);
      outline-offset: -3px;
    }
    .ranking-item[open] summary {
      background: var(--mint);
    }
    .ranking-summary-content {
      display: inline-grid;
      grid-template-columns: 30px 1fr 50px;
      width: calc(100% - 24px);
      align-items: center;
      vertical-align: middle;
    }
    .ranking-rank {
      font-weight: bold;
      color: var(--brand);
    }
    .ranking-count {
      text-align: right;
      color: var(--muted);
      font-size: 0.9em;
    }
    .ranking-dates {
      margin: 0;
      padding: 8px 12px 10px 46px;
      border-top: 1px solid var(--line);
      list-style: none;
    }
    .ranking-dates li {
      padding: 5px 0;
      color: var(--muted);
      font-size: 0.9em;
      font-variant-numeric: tabular-nums;
    }
    .event-metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 4px 0 14px;
      border-bottom: 1px solid var(--line);
    }
    .event-metrics span,
    .event-metrics strong {
      display: block;
    }
    .event-metrics span {
      color: var(--muted);
      font-size: .75rem;
    }
    .event-metrics strong {
      margin-top: 4px;
      font-size: 1.12rem;
      font-variant-numeric: tabular-nums;
    }
    .event-statistics h3 {
      margin: 22px 0 4px;
      padding: 10px 12px;
      border-left: 4px solid var(--teal);
      background: #edf5f4;
      color: var(--navy);
      font-size: .95rem;
      line-height: 1.4;
    }
    .event-winner-row-stat {
      border-bottom: 1px solid var(--line);
    }
    .event-winner-row-stat summary {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 4px;
      cursor: pointer;
      list-style: none;
    }
    .event-winner-row-stat summary::-webkit-details-marker {
      display: none;
    }
    .event-winner-row-stat summary::before {
      content: '▸';
      width: 14px;
      flex: none;
      color: var(--teal);
    }
    .event-winner-row-stat[open] summary::before {
      content: '▾';
    }
    .event-winner-row-stat summary:focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: -2px;
    }
    .event-winner-row-stat summary strong {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .event-winner-row-stat summary span {
      color: var(--teal);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .event-winner-row-stat ul,
    .event-history {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .event-winner-row-stat ul {
      margin: 0 4px 8px 22px;
      padding: 2px 12px;
      border-left: 2px solid #c5dfda;
      background: #f7fbfa;
    }
    .event-winner-row-stat li {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 8px;
      padding: 8px 0;
      font-size: .84rem;
      overflow-wrap: anywhere;
    }
    .event-winner-row-stat li + li {
      border-top: 1px solid var(--line);
    }
    .event-winner-row-stat time,
    .event-history time {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .event-history > li {
      padding: 12px 4px;
      border-bottom: 1px solid var(--line);
      overflow-wrap: anywhere;
    }
    .event-history > li > time {
      display: block;
      margin-bottom: 8px;
      color: var(--navy);
      font-size: .86rem;
      font-weight: 700;
    }
    .event-history > li > ul {
      margin: 0;
      padding: 0 0 0 12px;
      border-left: 2px solid #c5dfda;
      list-style: none;
    }
    .event-history > li > ul > li {
      padding: 7px 0 7px 10px;
      overflow-wrap: anywhere;
    }
    .event-history > li > ul > li + li {
      border-top: 1px solid var(--line);
    }
    .event-history li strong {
      display: block;
      font-size: .9rem;
    }
    .event-history li span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: .84rem;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <span class="eyebrow">TEAM-K</span>
      <h1>출석 통계</h1>
    </div>
    <button id="backButton" class="ghost">뒤로</button>
  </header>

  <main class="stats-container">
    <section class="card statistics-toolbar" aria-label="통계 조회 조건">
      <label for="statisticsYear">
        조회 연도
        <select id="statisticsYear" aria-label="조회 연도"></select>
      </label>
    </section>

    <div id="loadingMessage" class="message info visible" style="margin-top: 20px;">
      통계 데이터를 불러오는 중입니다...
    </div>

    <div id="statsContent" hidden>
      <section class="summary-grid statistics-summary">
        <article><span>전체 게임</span><strong id="totalGames">0</strong></article>
        <article><span>평균 참석</span><strong id="avgAttendees">0</strong></article>
        <article><span>최대 참석</span><strong id="maxAttendeesCount">0명</strong><small id="maxAttendeesGame" class="game-meta"></small></article>
        <article><span>최소 참석</span><strong id="minAttendeesCount">0명</strong><small id="minAttendeesGame" class="game-meta"></small></article>
      </section>

      <section class="card chart-card">
        <h2>월별/분기별 참석 추이</h2>
        <div class="chart-wrapper">
          <canvas id="monthlyChart"></canvas>
        </div>
      </section>

      <section class="card chart-card">
        <h2>필드별 평균 참석자 수</h2>
        <div class="chart-wrapper">
          <canvas id="fieldChart"></canvas>
        </div>
        <ul id="fieldAverageLegend" class="field-average-legend" aria-label="필드별 평균 참석자 수"></ul>
      </section>

      <section class="card chart-card">
        <h2>출석 랭킹 (Top 10)</h2>
        <div id="rankingList" class="ranking-list">
          <!-- 랭킹 항목이 여기에 추가됩니다 -->
        </div>
      </section>

      <section class="card chart-card event-statistics">
        <h2>이벤트 통계</h2>
        <p id="eventStatsUnavailable" class="muted" hidden>이벤트 통계를 일시적으로 사용할 수 없습니다.</p>
        <div id="eventStatsBody">
          <div class="event-metrics">
            <div><span>진행 이벤트</span><strong id="eventCount">0건</strong></div>
            <div><span>당첨 건수</span><strong id="eventWinCount">0건</strong></div>
            <div><span>당첨자</span><strong id="uniqueWinnerCount">0명</strong></div>
          </div>
          <h3>당첨자별 횟수</h3>
          <div id="eventWinnerRanking"></div>
          <h3 id="eventHistoryHeading">게임별 행사</h3>
          <ul id="eventHistory" class="event-history"></ul>
        </div>
      </section>
    </div>
  </main>

  <script src="./api.js"></script>
  <script src="./domain.js"></script>
  <script src="./statistics.js"></script>
</body>
</html>
